name: Bug report
description: DI Doctor crashed, gave a wrong verdict, or behaved unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Use fake identifiers only (`0000001`, `1111111111111`). Never paste tokens."
  - type: input
    id: version
    attributes:
      label: DI Doctor version and command
      placeholder: "di-doctor 0.1.0, `di-doctor validate x.json --env sandbox`"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened (full output, `--json` preferred)
      render: shell
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input that reproduces it (anonymised)
      render: json
