version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    ignore:
      # 5.1.x has a reporter crash on Node 24 that hides failure details; stay on 5.0.x until fixed upstream.
      - dependency-name: vitest
        versions: ['5.1.x']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
